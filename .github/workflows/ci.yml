name: CI

on:
  push:
  pull_request:

jobs:
  wallet:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: wallet } }
    steps:
      - uses: actions/checkout@v4
      # The same toolchain the image builds with (wallet/Dockerfile).
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.96.0" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: wallet }
      - run: cargo test --locked

  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # The exact, hashed versions the image installs, then the package and pytest.
      - run: pip install --require-hashes -r requirements.lock && pip install --no-deps -e . && pip install pytest
      - run: pytest -q

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Production images build
        run: |
          docker build -t cashr-api ./api
          docker build -t cashr-wallet ./wallet
      - name: Compose file is valid
        run: |
          cp .env.example .env
          sed -i 's/^CASHR_WALLET_RPC_PASSWORD=.*/CASHR_WALLET_RPC_PASSWORD=x/; s/^CASHR_WALLET_SEED_KEY=.*/CASHR_WALLET_SEED_KEY=x/; s/^API_DOMAIN=.*/API_DOMAIN=example.com/' .env
          docker compose --profile https --profile demo config -q
      - name: Scripts parse
        run: bash -n deploy/install.sh && bash -n deploy/backup.sh

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
        working-directory: web
      - run: npm run lint && npm test
        working-directory: web
      - run: npm run build
        working-directory: web
        env: { NEXT_PUBLIC_API_URL: "http://localhost:8000" }
      - name: End-to-end journey (simulated chain)
        run: |
          pip install --require-hashes -r api/requirements.lock && pip install --no-deps -e api
          (cd api && CASHR_CHAIN=sim CASHR_SCAN_INTERVAL=1 \
            CASHR_LIST_DELAY_MIN=0 CASHR_REFUND_SPREAD_MIN=0 CASHR_DOOR_SYNC_GRACE_MIN=0 \
            CASHR_DATABASE_URL=sqlite:///$RUNNER_TEMP/e2e.db uvicorn cashr.main:app --port 8000 &)
          (cd web && npm start &)
          npx --prefix web playwright install --with-deps chromium
          for i in $(seq 1 60); do curl -sf localhost:3000 >/dev/null && curl -sf localhost:8000/meta >/dev/null && break; sleep 1; done
          cd web && npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: e2e-failure, path: web/e2e-failure.png, if-no-files-found: ignore }

  # Prebuilt images, so servers download them instead of compiling Rust.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Only what passed every check, the end-to-end journey included.
    needs: [wallet, api, images, web]
    runs-on: ubuntu-latest
    # Pushes publish in order: a slower older run must not overwrite :main last.
    concurrency:
      group: publish-images
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        id: names
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./wallet
          push: true
          tags: ghcr.io/${{ steps.names.outputs.owner }}/cashr-wallet:main,ghcr.io/${{ steps.names.outputs.owner }}/cashr-wallet:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=wallet
          cache-to: type=gha,mode=max,scope=wallet
      - uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: ghcr.io/${{ steps.names.outputs.owner }}/cashr-api:main,ghcr.io/${{ steps.names.outputs.owner }}/cashr-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  # The live sites build from main, so they never drift behind it. Runs only when
  # the repository has a NETLIFY_AUTH_TOKEN secret; each site's API comes from a
  # repository variable (Settings → Secrets and variables → Actions).
  deploy-web:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web]
    runs-on: ubuntu-latest
    # Two quick pushes must not finish in the wrong order and leave an older build live.
    concurrency:
      group: deploy-web-${{ matrix.site.id }}
      cancel-in-progress: true
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    strategy:
      matrix:
        site:
          - { id: "5f3959f2-910d-4de2-8081-4aadbde86be7", api: MAINNET_API_URL, demo: "" }  # cashr.site (mainnet)
          - { id: "586dc4d7-fa6a-4eb5-b380-4a421ffed9f3", api: SIM_API_URL, demo: "1" }    # demo.cashr.site (simulated)
    steps:
      - if: env.NETLIFY_AUTH_TOKEN == ''
        run: echo "::warning::No NETLIFY_AUTH_TOKEN secret, so the web was NOT deployed. Deploy it manually."
      - if: env.NETLIFY_AUTH_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.NETLIFY_AUTH_TOKEN != ''
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - if: env.NETLIFY_AUTH_TOKEN != ''
        working-directory: web
        env:
          NEXT_PUBLIC_API_URL: ${{ vars[matrix.site.api] }}
          NEXT_PUBLIC_DEMO: ${{ matrix.site.demo }}
        run: |
          test -n "$NEXT_PUBLIC_API_URL" || { echo "Set the ${{ matrix.site.api }} repository variable"; exit 1; }
          npm ci
          npx --yes netlify-cli@26.1.0 deploy --build --prod --site "${{ matrix.site.id }}" --message "main ${GITHUB_SHA::7}"
