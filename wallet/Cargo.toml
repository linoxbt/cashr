[package]
name = "cashr-wallet"
version = "0.1.0"
edition = "2021"
publish = false
description = "Light-client Zcash wallet for cashr: syncs from lightwalletd, speaks a zcashd-style JSON-RPC subset."

[dependencies]
zcash_client_backend = { version = "0.24", features = ["lightwalletd-tonic", "lightwalletd-tonic-tls-webpki-roots", "orchard", "sync"] }
zcash_client_sqlite = { version = "0.22", features = ["orchard"] }
zcash_keys = { version = "0.16", features = ["orchard"] }
zcash_protocol = "0.10"
zcash_primitives = "0.30"
zcash_proofs = { version = "0.30", features = ["bundled-prover"] }
zcash_address = "0.13"
zip32 = "0.2"
zip321 = "0.9"
orchard = "0.15"

tonic = { version = "0.14", features = ["transport", "tls-ring", "tls-webpki-roots"] }
tokio-socks = "0.5"
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
async-trait = "0.1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = "0.37"
rand = "0.8"
secrecy = "0.8"
hex = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chacha20poly1305 = "0.10"
subtle = "2"

[profile.release]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
