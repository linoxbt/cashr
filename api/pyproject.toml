[project]
name = "cashr-api"
version = "0.1.0"
description = "cashr: RSVPs with refundable shielded-ZEC deposits and no attendee list."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cashr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
