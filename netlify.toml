# Netlify hosts the web app only (web/). The API and wallet need an always-on
# host; see docs/DEPLOY.md. Set NEXT_PUBLIC_API_URL in the Netlify site's
# environment variables to the API's public HTTPS URL before building.
[build]
  base = "web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Netlify's Next.js runtime (OpenNext). Usually auto-detected; declared here so
# API/CLI uploads get it too. Unpinned on purpose: Netlify keeps it current.
[[plugins]]
  package = "@netlify/plugin-nextjs"
