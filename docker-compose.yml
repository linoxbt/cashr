# The cashr backend: light-client wallet + API.
#   cp .env.example .env   # set secrets
#   docker compose up -d                       # API on 127.0.0.1:8000 only
#   docker compose --profile https up -d       # plus Caddy serving https://$API_DOMAIN
# Update: docker compose pull wallet api && docker compose up -d --no-build
#   (CASHR_TAG=<commit> in .env pins both images to the same commit.)
# On a fresh server, deploy/install.sh does all of this for you.
# The web app (web/) deploys separately (Netlify) with NEXT_PUBLIC_API_URL.

# Fixed, so volume names (cashr_wallet-data, ...) never depend on the folder name.
name: cashr

# Logs are small and rotated: they live outside the database, so a purge can't
# reach them. Nothing here logs visitors, ticket hashes, addresses or txids.
x-logging: &logging
  driver: local
  options:
    max-size: "1m"
    max-file: "1"
    compress: "false"  # the local driver can't compress with only one file

services:
  # The wallet reaches lightwalletd through Tor. Otherwise lightwalletd's
  # operator sees this server fetch exactly the transactions that are RSVPs,
  # and can match them to the attendees' own wallets broadcasting them.
  tor:
    build: ./deploy/tor
    image: cashr-tor:local
    restart: unless-stopped
    logging: *logging
    networks: [backend, testnet]
    # Not published: only the wallets use it.

  wallet:
    # Prebuilt by CI; `docker compose build` builds it from source instead.
    image: ghcr.io/linoxbt/cashr-wallet:${CASHR_TAG:-main}
    build: ./wallet
    restart: unless-stopped
    depends_on:
      tor: { condition: service_healthy }
    logging: *logging
    networks: [backend]
    environment:
      CASHR_WALLET_NETWORK: ${CASHR_NETWORK:-main}
      # Or your own lightwalletd/Zaino, e.g. http://lightwalletd:9067, for no third party at all.
      CASHR_WALLET_LIGHTWALLETD: ${CASHR_WALLET_LIGHTWALLETD:-https://zec.rocks:443}
      # Set CASHR_WALLET_SOCKS_PROXY= (empty) in .env to connect directly instead.
      CASHR_WALLET_SOCKS_PROXY: ${CASHR_WALLET_SOCKS_PROXY-tor:9050}
      CASHR_WALLET_RPC_USER: cashr
      CASHR_WALLET_RPC_PASSWORD: ${CASHR_WALLET_RPC_PASSWORD:?set CASHR_WALLET_RPC_PASSWORD}
      CASHR_WALLET_SEED_KEY: ${CASHR_WALLET_SEED_KEY:?set CASHR_WALLET_SEED_KEY}
    volumes:
      - wallet-data:/data   # per-event seeds (encrypted) and wallet state: back it up
    # Not published: only the API talks to the wallet.

  api:
    image: ghcr.io/linoxbt/cashr-api:${CASHR_TAG:-main}
    build: ./api
    restart: unless-stopped
    depends_on:
      wallet: { condition: service_healthy }
    logging: *logging
    networks: [backend, edge]
    environment:
      CASHR_CHAIN: rpc
      CASHR_NETWORK: ${CASHR_NETWORK:-main}
      # Privacy timing (docs/DEPLOY.md): public list updates, refund spread, door-sync grace.
      CASHR_LIST_DELAY_MIN: ${CASHR_LIST_DELAY_MIN:-120}
      CASHR_REFUND_SPREAD_MIN: ${CASHR_REFUND_SPREAD_MIN:-180}
      CASHR_DOOR_SYNC_GRACE_MIN: ${CASHR_DOOR_SYNC_GRACE_MIN:-30}
      CASHR_RPC_URL: http://wallet:8232
      CASHR_RPC_USER: cashr
      CASHR_RPC_PASSWORD: ${CASHR_WALLET_RPC_PASSWORD}
      CASHR_CORS_ORIGINS: ${CASHR_CORS_ORIGINS:?set your web origin}
    volumes:
      - api-data:/data
    ports:
      # Local only: the public reaches the API through Caddy (profile "https").
      - "127.0.0.1:${CASHR_API_PORT:-8000}:8000"

  caddy:
    image: caddy:2.8.4@sha256:226d1f059b75399fe19182893c7184591c07b97afc8dfcf44eeb80c9a77a530f
    profiles: ["https"]
    restart: unless-stopped
    logging: *logging
    depends_on: [api]
    networks: [edge]
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

  # Optional public demo on a simulated chain (`--profile demo`): the same API,
  # with made-up testnet addresses so no real ZEC can be sent to it, and no
  # batching or spreading so visitors see every step at once.
  demo-api:
    image: ghcr.io/linoxbt/cashr-api:${CASHR_TAG:-main}
    build: ./api
    profiles: ["demo"]
    restart: unless-stopped
    logging: *logging
    # Its own network: the public demo can't reach the mainnet wallet or Tor.
    networks: [demo]
    environment:
      CASHR_CHAIN: sim
      CASHR_NETWORK: test
      CASHR_SCAN_INTERVAL: "5"
      CASHR_LIST_DELAY_MIN: "0"
      CASHR_REFUND_SPREAD_MIN: "0"
      CASHR_DOOR_SYNC_GRACE_MIN: "0"
      # Keep the simulated wallets with the database, so a restart doesn't strand demo events.
      CASHR_SIM_STATE: /data/sim-state.pickle
      CASHR_CORS_ORIGINS: ${CASHR_DEMO_CORS_ORIGINS:-https://demo.cashr.site}
    volumes:
      - demo-data:/data
    ports:
      - "127.0.0.1:${CASHR_DEMO_PORT:-8768}:8000"

  # Optional public instance on the real Zcash *testnet* (`--profile testnet`): the
  # same wallet and API as mainnet with test coins, so the whole money path can be
  # tried on a live chain for free. Its own keys, volumes and network; shorter
  # privacy delays so a visitor sees each step the same day.
  wallet-testnet:
    image: ghcr.io/linoxbt/cashr-wallet:${CASHR_TAG:-main}
    build: ./wallet
    profiles: ["testnet"]
    restart: unless-stopped
    depends_on:
      tor: { condition: service_healthy }
    logging: *logging
    networks: [testnet]
    environment:
      CASHR_WALLET_NETWORK: test
      CASHR_WALLET_SOCKS_PROXY: tor:9050
      CASHR_WALLET_RPC_USER: cashr
      CASHR_WALLET_RPC_PASSWORD: ${CASHR_TESTNET_WALLET_RPC_PASSWORD:-}
      CASHR_WALLET_SEED_KEY: ${CASHR_TESTNET_WALLET_SEED_KEY:-}
    volumes:
      - testnet-wallet-data:/data

  testnet-api:
    image: ghcr.io/linoxbt/cashr-api:${CASHR_TAG:-main}
    build: ./api
    profiles: ["testnet"]
    restart: unless-stopped
    depends_on:
      wallet-testnet: { condition: service_healthy }
    logging: *logging
    networks: [testnet]
    environment:
      CASHR_CHAIN: rpc
      CASHR_NETWORK: test
      CASHR_LIST_DELAY_MIN: "10"
      CASHR_REFUND_SPREAD_MIN: "10"
      CASHR_DOOR_SYNC_GRACE_MIN: "5"
      CASHR_RPC_URL: http://wallet-testnet:8232
      CASHR_RPC_USER: cashr
      CASHR_RPC_PASSWORD: ${CASHR_TESTNET_WALLET_RPC_PASSWORD:-}
      CASHR_CORS_ORIGINS: ${CASHR_TESTNET_CORS_ORIGINS:-https://testnet.cashr.site}
    volumes:
      - testnet-api-data:/data
    ports:
      - "127.0.0.1:${CASHR_TESTNET_PORT:-8769}:8000"

networks:
  # Tor, the wallet and the API. Tor needs the internet; nothing else joins.
  backend:
  # The API and the bundled HTTPS proxy.
  edge:
  demo:
  # The testnet wallet and API, plus Tor.
  testnet:

volumes:
  wallet-data:
  api-data:
  caddy-data:
  demo-data:
  testnet-wallet-data:
  testnet-api-data:
