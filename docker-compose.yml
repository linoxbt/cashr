# The Unlisted backend: light-client wallet + API.
#   cp .env.example .env   # set secrets
#   docker compose up -d                       # API on 127.0.0.1:8000 only
#   docker compose --profile https up -d       # plus Caddy serving https://$API_DOMAIN
# On a fresh server, deploy/install.sh does all of this for you.
# The web app (web/) deploys separately (Netlify) with NEXT_PUBLIC_API_URL.
services:
  wallet:
    # Prebuilt by CI; `docker compose build` builds it from source instead.
    image: ghcr.io/linoxbt/cashr-wallet:${UNLISTED_TAG:-main}
    build: ./wallet
    restart: unless-stopped
    environment:
      UW_NETWORK: ${UNLISTED_NETWORK:-main}
      UW_LIGHTWALLETD: ${UW_LIGHTWALLETD:-https://zec.rocks:443}
      UW_RPC_USER: unlisted
      UW_RPC_PASSWORD: ${UW_RPC_PASSWORD:?set UW_RPC_PASSWORD}
      UW_SEED_KEY: ${UW_SEED_KEY:?set UW_SEED_KEY}
    volumes:
      - wallet-data:/data   # per-event seeds (encrypted) and wallet state: back it up
    # Not published: only the API talks to the wallet.

  api:
    image: ghcr.io/linoxbt/cashr-api:${UNLISTED_TAG:-main}
    build: ./api
    restart: unless-stopped
    depends_on: [wallet]
    environment:
      UNLISTED_CHAIN: rpc
      UNLISTED_NETWORK: ${UNLISTED_NETWORK:-main}
      UNLISTED_SECRET: ${UNLISTED_SECRET:?set UNLISTED_SECRET}
      UNLISTED_RPC_URL: http://wallet:8232
      UNLISTED_RPC_USER: unlisted
      UNLISTED_RPC_PASSWORD: ${UW_RPC_PASSWORD}
      UNLISTED_CORS_ORIGINS: ${UNLISTED_CORS_ORIGINS:?set your web origin}
    volumes:
      - api-data:/data
    ports:
      # Local only: the public reaches the API through Caddy (profile "https").
      - "127.0.0.1:8000:8000"

  caddy:
    image: caddy:2.8.4
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [api]
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  wallet-data:
  api-data:
  caddy-data:
